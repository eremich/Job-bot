name: Collect jobs

on:
  schedule:
    # Backup only: GitHub's own scheduler often skips runs, so an external hourly
    # alarm also pushes data/tick.txt (see push trigger below).
    # Every hour 07:xx–22:xx Berlin (cron is UTC; Berlin = UTC+1 in winter, +2 in summer)
    - cron: "11 5-21 * * *"
  workflow_dispatch:      # "Run workflow" button, /run in Telegram, external alarm (cron-job.org)
    inputs:
      quiet:
        description: "true = only message when there are new matching jobs (used by the hourly alarm)"
        required: false
        default: "false"
  push:                   # any code/config change → run right away
    branches: [main]
    paths: ["bot/**", "config.yaml", "profile/**", "requirements.txt", ".github/workflows/collect.yml", "data/tick.txt"]  # tick = external hourly alarm

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, score, send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_LABEL: ${{ vars.EMAIL_LABEL || 'Jobs' }}
          QUIET: ${{ inputs.quiet || 'false' }}
        run: python -m bot.collect
      - name: Remember seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "jobs: $(date -u +%F_%H%M)"
          git pull --rebase --autostash && git push
